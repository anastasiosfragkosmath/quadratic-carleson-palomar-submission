name = "quadratic_carleson"
version = "0.1.0"
keywords = ["math"]
# The normal build checks the completed formalization.  The separate
# Challenge/Solution libraries are built only by the manual Comparator workflow.
defaultTargets = ["QuadraticCarleson"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.34.0-rc2"

[[lean_lib]]
name = "QuadraticCarleson"
# Compile the root module and every formalization submodule in regular CI.
globs = ["QuadraticCarleson.*"]

[[lean_lib]]
name = "Challenge"
roots = ["Challenge"]

[[lean_lib]]
name = "Solution"
roots = ["Solution"]
