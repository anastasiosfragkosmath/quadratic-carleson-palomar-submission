name: Set up pinned Lean
description: Install the pinned Elan launcher and select this repository's Lean toolchain.

runs:
  using: composite
  steps:
    - name: Install Elan 4.2.3
      shell: bash
      env:
        ELAN_VERSION: v4.2.3
        ELAN_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
      run: |
        set -euo pipefail

        archive="$RUNNER_TEMP/elan-${ELAN_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
        installer_dir="$RUNNER_TEMP/elan-installer-${ELAN_VERSION}"
        mkdir -p "$installer_dir"

        curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
          "https://github.com/leanprover/elan/releases/download/${ELAN_VERSION}/elan-x86_64-unknown-linux-gnu.tar.gz" \
          --output "$archive"
        echo "${ELAN_SHA256}  ${archive}" | sha256sum --check --strict
        tar -xzf "$archive" --directory "$installer_dir"
        "$installer_dir/elan-init" -y --no-modify-path --default-toolchain none

        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
        "$HOME/.elan/bin/elan" --version
        "$HOME/.elan/bin/lean" --version
        "$HOME/.elan/bin/lake" --version
